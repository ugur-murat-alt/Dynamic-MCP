[package]
name = "mcp-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
interprocess = { version = "=2.4.2", features = ["tokio"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
mcp-host-core = { version = "0.2.0", path = "../mcp-host-core" }
mcp-host-mcp = { version = "0.2.0", path = "../mcp-host-mcp" }
notify = "8.2.0"
rmcp = { version = "=3.0.0-beta.2", default-features = false, features = ["base64", "client", "server", "macros", "schemars", "transport-io", "transport-child-process", "transport-async-rw", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "signal", "fs", "io-std", "process", "net"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8"
