[package]
name = "mcp-host-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
futures-util = "0.3"
http = "1"
mcp-host-core = { version = "0.2.0", path = "../mcp-host-core" }
process-wrap = { version = "9.1.0", features = ["tokio1"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
rmcp = { version = "=3.0.0-beta.2", default-features = false, features = ["base64", "client", "server", "macros", "schemars", "transport-io", "transport-child-process", "transport-async-rw", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-native-tls", "auth"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[lints]
workspace = true
