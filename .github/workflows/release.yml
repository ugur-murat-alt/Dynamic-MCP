name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "mcp-host") | .version')"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: mcp-host
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: mcp-host
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mcp-host
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: mcp-host.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin mcp-host
      - name: Package release archive
        shell: bash
        run: |
          ASSET="mcp-host-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" package/
          cp README.md LICENSE package/
          cp -R skills package/
          tar -czf "dist/$ASSET" -C package .
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Dynamic MCP Host $GITHUB_REF_NAME"
